name: AUXANOS Core Banking CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    name: Build, Typecheck & Run Ledger/KYC/FX/Escrow Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @auxanos/shared and @auxanos/api
        run: npm run build --workspace=@auxanos/shared && npm run build --workspace=@auxanos/api

      - name: Run unit and integration test suites
        run: npm test
